# paperrocket-book: light check on our own branches and main. New file, not upstream. (CI for pr/** and main)
# Uses the lockfile exactly as upstream ships it (yarn, immutable), the same Node and yarn as upstream's yarn-install action.
name: paperrocket check

on:
  push:
    branches:
      - "pr/**"
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=12288

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Self-test runtime branding script
        run: sh paperrocket/test-runtime-brand.sh

      - uses: actions/setup-node@v4
        with:
          node-version: v22.x

      # yarn itself is pinned by yarnPath in .yarnrc.yml, so no corepack step is needed.
      - name: Install dependencies
        run: yarn install --immutable --inline-builds
        env:
          YARN_ENABLE_GLOBAL_CACHE: "false"

      # Only the packages we touch. Turbo runs the trpc build first (dependsOn in turbo.json).
      - name: Type-check touched packages
        run: yarn turbo run type-check:ci --filter=@calcom/web --filter=@calcom/app-store --log-prefix=none

      # Our unit tests: letterhead and wording for every booking email, and the local login limiter.
      # Each email is also written out as HTML and uploaded, so it can be looked at.
      - name: Test emails and rate limiter
        run: yarn vitest run packages/emails/paperrocket-emails.test.ts packages/lib/rateLimit.local.test.ts
        env:
          TZ: UTC
          PR_SNAPSHOT_DIR: ${{ runner.temp }}/email-snapshots

      - name: Upload email snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: email-snapshots
          path: ${{ runner.temp }}/email-snapshots
          if-no-files-found: ignore
